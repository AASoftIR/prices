name: Update TGJU market data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions' minimum supported schedule interval is 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tgju-market-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout crawler code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Parser unit tests
        run: pytest -q

      - name: Restore rolling 1-hour state from market-data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin market-data:refs/remotes/origin/market-data || true
          if git show origin/market-data:state/history.json > /tmp/history.json 2>/dev/null; then
            echo "Restored previous rolling state"
          else
            printf '{"version":1,"samples":{}}\n' > /tmp/history.json
            echo "No previous state; starting fresh"
          fi

      - name: Crawl TGJU and build BahaBar-compatible JSON
        run: |
          python scripts/tgju_crawler.py \
            --state-in /tmp/history.json \
            --state-out build/history.json \
            --output build/latest.json \
            --health build/health.json

      - name: Validate generated feed
        run: python scripts/validate_json.py build/latest.json

      - name: Show important values
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/latest.json', encoding='utf-8'))['data']
          print('USD       :', d['currency']['USD']['current'], 'toman')
          print('Gold 18K  :', d['gold']['GOLD18K']['current'], 'toman')
          print('Emami coin:', d['gold']['SEKE_EMAMI']['current'], 'toman')
          print('BTC       :', d['crypto']['BTC']['current'], 'toman')
          PY

      - name: Preserve diagnostics if crawl failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tgju-crawler-diagnostics
          path: |
            build/health.json
            build/latest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish a single-snapshot market-data branch
        if: success()
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          cp build/latest.json /tmp/latest.json
          cp build/health.json /tmp/health.json
          cp build/history.json /tmp/history-out.json

          # Keep crawler code/history clean: market-data always contains one snapshot commit.
          git switch --orphan market-data-publish
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          mkdir -p data state
          cp /tmp/latest.json data/latest.json
          cp /tmp/health.json data/health.json
          cp /tmp/history-out.json state/history.json

          cat > README.md <<EOF
          # BahaBar live market data

          Automatically refreshed from TGJU by GitHub Actions.

          Stable raw endpoint:

          https://raw.githubusercontent.com/${REPOSITORY}/market-data/data/latest.json
          EOF

          git add README.md data/latest.json data/health.json state/history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh TGJU snapshot"
          git push --force origin HEAD:market-data

      - name: Print test endpoint
        if: success()
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Feed URL: https://raw.githubusercontent.com/${REPOSITORY}/market-data/data/latest.json"
          echo "Health URL: https://raw.githubusercontent.com/${REPOSITORY}/market-data/data/health.json"
